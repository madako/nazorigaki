<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>なぞりがき</title>
<link rel="stylesheet" href="style.css?v=20260725b" />
</head>
<body>
<header class="app-header">
  <h1><a href="https://www.nyaou.com/madakotools/nazorigaki/">✏️ なぞりがき</a></h1>
  <div class="mode-switch" role="tablist">
    <button id="mode-parent" class="mode-btn active" data-mode="parent" role="tab" aria-selected="true">👨‍👩‍👧 おやモード</button>
    <button id="mode-child" class="mode-btn" data-mode="child" role="tab" aria-selected="false">🧒 こどもモード</button>
  </div>
</header>

<div id="shared-banner" class="shared-banner hidden">
  <span id="shared-banner-text">🔗 共有されたなぞりがきです。こどもモードでなぞって練習しましょう。</span>
  <a id="shared-new-link" href="./">✏️ 自分でつくる</a>
</div>

<main class="app-main">
  <aside id="toolbar-parent" class="toolbar">
    <div class="tool-group">
      <button id="tool-parent-pen" class="tool-btn active" data-tool="pen">✏️ ペン</button>
      <button id="tool-parent-eraser" class="tool-btn" data-tool="eraser">🧹 一本消し</button>
    </div>
    <label class="switch-label">
      <input type="checkbox" id="order-mode-toggle" />
      <span>🔢 書き順モード</span>
    </label>
    <button id="publish-btn" class="tool-btn publish-btn">🔗 公開する</button>

    <details class="settings-accordion">
      <summary>⚙️ サイズ・練習の詳細設定</summary>
      <div class="accordion-body">
        <div class="tool-group">
          <span class="group-title">📐 サイズ変更(ベース)</span>
          <label class="num-input-row">幅<input type="number" id="canvas-width-input" min="300" max="1400" step="10" value="600"></label>
          <label class="num-input-row">高さ<input type="number" id="canvas-height-input" min="200" max="1000" step="10" value="600"></label>
          <button id="canvas-resize-apply" class="tool-btn">↔️ サイズ適用</button>
        </div>
        <div class="tool-group">
          <span class="group-title">✍️ 練習キャンバス(こどもモード)</span>
          <label class="num-input-row">練習回数
            <select id="practice-count-select">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </label>
          <label class="switch-label">
            <input type="checkbox" id="blank-canvas-toggle" />
            <span>📄 最後に無地の練習キャンバス表示</span>
          </label>
        </div>
      </div>
    </details>

    <button id="parent-clear-all" class="clear-link-btn">🗑️ すべて消す</button>
  </aside>

  <aside id="toolbar-child" class="toolbar hidden">
    <div class="tool-group">
      <button id="tool-child-pen" class="tool-btn active" data-tool="pen">✏️ ペン</button>
      <button id="tool-child-eraser" class="tool-btn" data-tool="eraser">🧹 一本消し</button>
    </div>
    <div class="tool-group color-palette" id="child-color-palette">
      <!-- color swatches injected by JS -->
    </div>
    <div class="tool-group">
      <button id="child-clear-all" class="danger-btn">🗑️ すべて消す</button>
    </div>
  </aside>

  <div class="canvas-wrap">
    <div id="canvas-list" class="canvas-list"></div>
  </div>
</main>

<div id="publish-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>🔗 なぞりがきを公開しました</h2>
    <p>このリンクを共有すると、見た人はこどもモードでなぞりがきができます。</p>
    <div class="publish-link-row">
      <input type="text" id="publish-link-input" readonly />
      <button id="publish-copy-btn" class="tool-btn">📋 コピー</button>
    </div>
    <div class="modal-actions">
      <button id="publish-close-btn" class="tool-btn">閉じる</button>
    </div>
  </div>
</div>

<script src="app.js?v=20260725b"></script>
<footer class="app-footer">© 2026 まだこ</footer>
</body>
</html>
