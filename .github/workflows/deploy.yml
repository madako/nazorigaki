name: Deploy to XREA via SFTP

on:
  push:
    branches:
      - main  # mainブランチにPushされた時に実行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 1. XREAの「SSH接続IP許可」をAPI/Webリクエストで事前更新するステップ
      # -----------------------------------------------------------------
      - name: Enable XREA SSH IP Permission
        run: |
          # ランナー自身のパブリックIPを取得
          CURRENT_IP=$(curl -s https://api.ipify.org)
          echo "Current Runner IP: $CURRENT_IP"
          
          # XREAのSSH IP許可更新APIまたはフォームを叩く処理
          # ※ XREAマイページ/コントロールパネルのSSH登録URLに対してPOSTリクエストを送信します。
          # APIトークンやログイン情報を用いてIPを許可登録してください。

      # -----------------------------------------------------------------
      # 2. SFTP転送を実行するステップ
      # -----------------------------------------------------------------
      - name: SFTP Deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.XREA_HOST }}
          port: ${{ secrets.XREA_PORT }}
          username: ${{ secrets.XREA_USER }}
          password: ${{ secrets.XREA_PASSWORD }}
          local_path: './*'                   # 転送元のローカルパス（ビルド成果物がある場合は `./dist/*` 等）
          remote_path: '/public_html'          # 画面に表示されているドキュメントルート
          sftp_only: true
