name: Deploy to XREA via FTPS

on:
  push:
    branches:
      - main  # mainブランチにPushされた時に実行
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir -p dist
          cp index.html style.css app.js dist/

      - name: FTPS Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.XREA_HOST }}
          port: ${{ secrets.XREA_PORT }}
          username: ${{ secrets.XREA_USER }}
          password: ${{ secrets.XREA_PASSWORD }}
          protocol: ftps
          local-dir: './dist/'
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/madakotools/nazorigaki/' }}
